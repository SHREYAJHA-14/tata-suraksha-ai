services:
  - type: web
    name: tata-suraksha-ai
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn tata_suraksha.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.0"
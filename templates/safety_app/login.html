{% extends 'safety_app/base.html' %}

{% block title %}Employee Login | Tata Suraksha AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; margin: 3rem auto;">
    <!-- Simple Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: white; margin-bottom: 0.5rem;">
            Tata Suraksha AI
        </h1>
        <p style="color: #9ca3af; font-size: 0.9rem;">
            Safety Training & Assessment Platform
        </p>
    </div>

    <!-- Login Form Card -->
    <div class="card">
        <h2 style="font-size: 1.2rem; font-weight: 700; color: white; margin-bottom: 1.5rem; text-align: center; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
            Employee Login
        </h2>

        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #d1d5db; margin-bottom: 0.4rem;">
                    Full Name
                </label>
                <input type="text" name="name" required placeholder="Enter Full Name" 
                       style="width: 100%; padding: 0.75rem 1rem; background: #090d16; border: 1px solid var(--card-border); border-radius: 0.5rem; color: white; font-size: 0.9rem;">
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #d1d5db; margin-bottom: 0.4rem;">
                    Employee ID
                </label>
                <input type="text" name="emp_id" required placeholder="Enter Employee ID" 
                       style="width: 100%; padding: 0.75rem 1rem; background: #090d16; border: 1px solid var(--card-border); border-radius: 0.5rem; color: white; font-size: 0.9rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #d1d5db; margin-bottom: 0.4rem;">
                    Department
                </label>
                <select name="department_id" required 
                        style="width: 100%; padding: 0.75rem 1rem; background: #090d16; border: 1px solid var(--card-border); border-radius: 0.5rem; color: white; font-size: 0.9rem;">
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">
                Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}
